# Copie este arquivo para config.yaml e preencha com o seu perfil.
# Enquanto estas listas estiverem vazias, o filtro deixa passar QUASE TUDO
# (só respeita budget_min/max se preenchidos) — use vazio apenas para teste.

# Categorias do 99Freelas que você aceita (nomes como aparecem no site).
# Exemplos comuns: "Programação & Tecnologia", "Design & Criação", "Redação & Tradução"
categories: []

# Idade máxima do projeto, em minutos, desde a publicação. Projetos mais antigos são
# ignorados. null = sem limite. Se a idade não puder ser determinada (seletor de data
# ainda não validado, ou formato de texto não reconhecido), o filtro não bloqueia.
max_project_age_minutes: null

# Se a vaga contiver QUALQUER uma destas palavras (título ou descrição), ela passa no filtro.
# Case-insensitive. Exemplo: ["python", "automação", "scraper", "backend"]
keywords_include: []

# Se a vaga contiver QUALQUER uma destas palavras, ela é descartada mesmo que bata em keywords_include.
# Exemplo: ["wordpress", "php legado", "sem remuneração"]
keywords_exclude: []

# Orçamento mínimo aceito, em R$. Deixe null pra não filtrar por mínimo.
budget_min: null

# Orçamento máximo que você ainda topa (evita projetos gigantes fora do seu escopo). null = sem limite.
budget_max: null

proposal:
  # "orcamento_cliente" usa o valor pedido pelo cliente
  # "fixo" usa oferta_fixa abaixo
  # "menor_proposta" lê o valor médio das propostas concorrentes no projeto e oferece
  #   essa média arredondada pra baixo na centena (1230 -> 1200; abaixo de R$100, na
  #   dezena); se ainda não houver média, a IA sugere o valor
  oferta_estrategia: "orcamento_cliente"
  oferta_fixa: null                          # usado só se oferta_estrategia = "fixo"
  prazo_dias: 7

  # Só manda pro Telegram depois que a página de envio mostrar a média de valor e de
  # prazo das propostas concorrentes (o site mostra a partir de ~5 propostas). Até lá o
  # projeto fica "awaiting_average" em data/applied_jobs.json e é checado de novo a cada
  # ciclo de varredura. Desiste depois de aguardar_media_max_horas (trava de segurança).
  # Com a média de prazo, o prazo proposto fica prazo_desconto_percent% abaixo dela
  # (ex: média 10 dias -> 8 dias). Links colados manualmente no Telegram não esperam.
  aguardar_media: true
  aguardar_media_max_horas: 48
  prazo_desconto_percent: 20

  # Desconto paliativo sobre a sugestão de preço da IA (usada só quando não há nem
  # orçamento do cliente nem propostas concorrentes pra basear o valor — ver
  # ai_writer.suggest_price_and_deadline). Por experiência no 99Freelas, a IA sugere um
  # preço de mercado "real", mas cliente costuma fechar com o mais barato — arredonda a
  # sugestão pra baixo no milhar mais próximo e desconta mais ia_desconto_milhar reais
  # (ex: sugestão R$2400 -> oferta R$1000; R$3300 -> R$2000). Só se aplica a sugestões
  # >= R$1000; abaixo disso já é considerado baixo o suficiente e fica como está. Nunca
  # deixa a oferta final abaixo de ia_preco_minimo. Ajuste esses dois valores conforme for
  # validando o resultado das próximas propostas.
  ia_desconto_milhar: 1000
  ia_preco_minimo: 150

  # "ia" gera o texto a partir da descrição completa do projeto; regras de não incluir
  #   contato/valor/prazo são reforçadas por um filtro automático — se a IA falhar ou
  #   violar essas regras, cai pro "texto" abaixo.
  # "fixo" sempre usa o "texto" abaixo.
  texto_modo: "fixo"
  ia_provider: "gemini"          # "anthropic" (requer ANTHROPIC_API_KEY) ou "gemini" (requer GEMINI_API_KEY)
  ia_model: "gemini-3.6-flash"   # ajuste conforme o provedor acima

  # Estilo do texto (texto_modo "ia"): sorteado a cada proposta pelos pesos abaixo, pra
  # descobrir qual converte melhor. Peso 0 (ou remover a linha) tira o estilo do sorteio.
  #   padrao      — estilo original: profissional e direto, até ~1500 caracteres
  #   pergunta    — curto, termina com uma pergunta sobre o projeto
  #   plano       — resumo + 3-4 etapas numeradas + o que o cliente recebe
  #   minimo      — 2-3 frases, até ~300 caracteres
  #   resultado   — foca em como fica a situação do cliente depois do trabalho
  #   diagnostico — aponta um cuidado/risco que o cliente não citou e como tratar
  #   opcoes      — oferece um caminho enxuto e um completo, pergunta qual prefere
  #   conversa    — tom informal e próximo, sem cara de proposta
  # Cada envio grava o estilo em data/applied_jobs.json. Quando um cliente responder, cole
  # o link do projeto no chat do bot e clique "💬 Respondeu" (ou "🏆 Fechou"); depois rode
  # `python bot/report.py` pra ver as taxas por estilo.
  texto_variantes:
    padrao: 1
    pergunta: 1
    plano: 1
    minimo: 1
    resultado: 1
    diagnostico: 1
    opcoes: 1
    conversa: 1

  # Template fixo (usado quando texto_modo == "fixo", ou como fallback se a IA falhar).
  # Variável disponível: {titulo}. NUNCA inclua {oferta}/{prazo_dias} aqui — valor e prazo
  # vão só nos campos próprios do formulário (#oferta/#duracao-estimada), nunca no texto.
  texto: |
    Olá! Tenho experiência relevante com {titulo} e gostaria de me candidatar a este projeto.

    Fico à disposição para conversarmos sobre os detalhes. Obrigado pela oportunidade!

  # Nota fixa opcional, anexada ao final de QUALQUER texto (IA ou template fixo), sempre
  # do jeito exato escrito aqui — nunca reformulada pela IA. null/"" = não anexa nada.
  nota_extra: null
